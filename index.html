<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceApp - Gestão Financeira</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h1>FinanceApp</h1>
            <p>Controle suas finanças de forma simples e moderna.</p>
            <button id="login-btn" class="btn-primary">Entrar com o Google</button>
        </div>
    </div>

    <!-- DASHBOARD (Oculto até o login) -->
    <div id="app-screen" class="app-container hidden">
        <header class="header">
            <div class="user-info">
                <img id="user-photo" src="" alt="Foto do usuário" class="avatar">
                <span id="user-name">Usuário</span>
            </div>
            <button id="logout-btn" class="btn-secondary">Sair</button>
        </header>

        <main class="main-content">
            <!-- Barra de Filtros por Período -->
            <section class="filter-panel">
                <div class="filter-group">
                    <label for="filter-month">Mês:</label>
                    <select id="filter-month">
                        <option value="all">Todos os Meses</option>
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-year">Ano:</label>
                    <select id="filter-year">
                        <option value="all">Todos os Anos</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </section>

            <!-- Cards de Resumo -->
            <section class="cards-grid">
                <div class="card">
                    <h3>Saldo Total</h3>
                    <p id="total-balance" class="amount">R$ 0,00</p>
                </div>
                <div class="card income">
                    <h3>Receitas</h3>
                    <p id="total-income" class="amount">R$ 0,00</p>
                </div>
                <div class="card expense">
                    <h3>Despesas</h3>
                    <p id="total-expense" class="amount">R$ 0,00</p>
                </div>
            </section>

            <!-- Seção de Gráficos e Formulário/Histórico -->
            <div class="dashboard-grid">
                <!-- Formulário de Transação -->
                <div class="panel">
                    <h2>Nova Transação</h2>
                    <form id="transaction-form">
                        <div class="form-group">
                            <label for="description">Descrição</label>
                            <input type="text" id="description" placeholder="Ex: Supermercado, Aluguel..." required>
                        </div>
                        <div class="form-group">
                            <label for="amount">Valor (R$)</label>
                            <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Tipo</label>
                            <select id="type">
                                <option value="income">Receita</option>
                                <option value="expense">Despesa</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="category">Categoria</label>
                            <select id="category">
                                <option value="Alimentação">Alimentação</option>
                                <option value="Moradia">Moradia</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Salário">Salário</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Data</label>
                            <input type="date" id="date" required>
                        </div>
                        <button type="submit" class="btn-primary">Adicionar Transação</button>
                    </form>
                </div>

                <!-- Gráfico de Despesas -->
                <div class="panel chart-panel">
                    <h2>Despesas por Categoria</h2>
                    <div class="chart-container">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Lista de Transações -->
            <div class="panel full-width-panel">
                <h2>Histórico de Transações</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Valor</th>
                                <th>Tipo</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list">
                            <!-- Injetado via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
